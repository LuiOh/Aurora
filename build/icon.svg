<!-- Aurora 앱 아이콘 원본. 오로라가 흐르는 밤하늘에서 작은 별 열 개가 둥근 선으로 이어져 큰 별 하나를 그린다. build/icon.png 등은 scripts/icons.sh로 만든다 -->
<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#0b1440"/>
      <stop offset="0.6" stop-color="#151a52"/>
      <stop offset="1" stop-color="#2a1757"/>
    </linearGradient>
    <linearGradient id="auroraA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2dffb3" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#2dffb3"/>
      <stop offset="0.7" stop-color="#36d6ff"/>
      <stop offset="1" stop-color="#8a6cff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="auroraB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b56cff" stop-opacity="0"/>
      <stop offset="0.4" stop-color="#9b7bff"/>
      <stop offset="0.8" stop-color="#3fe0c5"/>
      <stop offset="1" stop-color="#3fe0c5" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b8fff0"/>
      <stop offset="1" stop-color="#d9c8ff"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="0.35" stop-color="#9ffff0" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#9ffff0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="core" cx="0.5" cy="0.54" r="0.5">
      <stop offset="0" stop-color="#7dffd8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7dffd8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="26"/></filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="14" result="b"/>
      <feFlood flood-color="#000" flood-opacity="0.3"/>
      <feComposite in2="b" operator="in" result="s"/>
      <feMerge><feMergeNode in="s"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="body"><rect x="100" y="100" width="824" height="824" rx="186"/></clipPath>
  </defs>

  <!-- 바탕: 맥 앱 아이콘 규격의 둥근 사각형에 밤하늘 -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#sky)"/>
  </g>

  <g clip-path="url(#body)">
    <!-- 오로라 띠 두 줄 -->
    <path d="M60 330 C260 180 420 380 600 250 S900 150 980 230" stroke="url(#auroraA)" stroke-width="110" fill="none" opacity="0.75" filter="url(#blur)"/>
    <path d="M40 470 C240 380 430 520 640 400 S900 330 990 380" stroke="url(#auroraB)" stroke-width="80" fill="none" opacity="0.55" filter="url(#blur)"/>
    <rect x="100" y="100" width="824" height="824" fill="url(#core)"/>
    <!-- 배경의 작은 별 -->
    <circle cx="210" cy="230" r="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="790" cy="210" r="6" fill="#ffffff" opacity="0.55"/>
    <circle cx="860" cy="420" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="170" cy="470" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="300" cy="820" r="5" fill="#ffffff" opacity="0.55"/>
    <circle cx="760" cy="840" r="4" fill="#ffffff" opacity="0.4"/>
    <circle cx="640" cy="170" r="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="380" cy="190" r="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="880" cy="700" r="3" fill="#ffffff" opacity="0.4"/>
    <circle cx="150" cy="690" r="3" fill="#ffffff" opacity="0.4"/>
  </g>

  <!-- 별자리: 별 열 개를 잇는 선이 큰 별을 그린다 -->
  <path d="M512.0 258.0 C531.7 258.0 528.0 352.0 610.7 412.1 C693.5 472.2 781.7 439.6 787.8 458.4 C793.9 477.2 703.4 502.6 671.8 599.9 C640.2 697.2 698.4 771.0 682.5 782.6 C666.5 794.2 614.3 716.0 512.0 716.0 C409.7 716.0 357.5 794.2 341.5 782.6 C325.6 771.0 383.8 697.2 352.2 599.9 C320.6 502.6 230.1 477.2 236.2 458.4 C242.3 439.6 330.5 472.2 413.3 412.1 C496.0 352.0 492.3 258.0 512.0 258.0Z" fill="#bffff0" fill-opacity="0.07" stroke="url(#line)" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" opacity="0.55" filter="url(#glow)"/>
  <path d="M512.0 258.0 C531.7 258.0 528.0 352.0 610.7 412.1 C693.5 472.2 781.7 439.6 787.8 458.4 C793.9 477.2 703.4 502.6 671.8 599.9 C640.2 697.2 698.4 771.0 682.5 782.6 C666.5 794.2 614.3 716.0 512.0 716.0 C409.7 716.0 357.5 794.2 341.5 782.6 C325.6 771.0 383.8 697.2 352.2 599.9 C320.6 502.6 230.1 477.2 236.2 458.4 C242.3 439.6 330.5 472.2 413.3 412.1 C496.0 352.0 492.3 258.0 512.0 258.0Z" fill="none" stroke="url(#line)" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="0.95"/>
  <g>
    <circle cx="512.0" cy="258.0" r="48" fill="url(#halo)"/>
    <path d="M512.0 218.0 C521.0 249.0 521.0 249.0 552.0 258.0 C521.0 267.0 521.0 267.0 512.0 298.0 C503.0 267.0 503.0 267.0 472.0 258.0 C503.0 249.0 503.0 249.0 512.0 218.0Z" fill="#ffffff"/>
    <circle cx="610.7" cy="412.1" r="24" fill="url(#halo)"/>
    <circle cx="610.7" cy="412.1" r="10" fill="#f2fff9"/>
    <circle cx="787.8" cy="458.4" r="48" fill="url(#halo)"/>
    <path d="M787.8 418.4 C796.8 449.4 796.8 449.4 827.8 458.4 C796.8 467.4 796.8 467.4 787.8 498.4 C778.8 467.4 778.8 467.4 747.8 458.4 C778.8 449.4 778.8 449.4 787.8 418.4Z" fill="#ffffff"/>
    <circle cx="671.8" cy="599.9" r="24" fill="url(#halo)"/>
    <circle cx="671.8" cy="599.9" r="10" fill="#f2fff9"/>
    <circle cx="682.5" cy="782.6" r="48" fill="url(#halo)"/>
    <path d="M682.5 742.6 C691.5 773.6 691.5 773.6 722.5 782.6 C691.5 791.6 691.5 791.6 682.5 822.6 C673.5 791.6 673.5 791.6 642.5 782.6 C673.5 773.6 673.5 773.6 682.5 742.6Z" fill="#ffffff"/>
    <circle cx="512.0" cy="716.0" r="24" fill="url(#halo)"/>
    <circle cx="512.0" cy="716.0" r="10" fill="#f2fff9"/>
    <circle cx="341.5" cy="782.6" r="48" fill="url(#halo)"/>
    <path d="M341.5 742.6 C350.5 773.6 350.5 773.6 381.5 782.6 C350.5 791.6 350.5 791.6 341.5 822.6 C332.5 791.6 332.5 791.6 301.5 782.6 C332.5 773.6 332.5 773.6 341.5 742.6Z" fill="#ffffff"/>
    <circle cx="352.2" cy="599.9" r="24" fill="url(#halo)"/>
    <circle cx="352.2" cy="599.9" r="10" fill="#f2fff9"/>
    <circle cx="236.2" cy="458.4" r="48" fill="url(#halo)"/>
    <path d="M236.2 418.4 C245.2 449.4 245.2 449.4 276.2 458.4 C245.2 467.4 245.2 467.4 236.2 498.4 C227.2 467.4 227.2 467.4 196.2 458.4 C227.2 449.4 227.2 449.4 236.2 418.4Z" fill="#ffffff"/>
    <circle cx="413.3" cy="412.1" r="24" fill="url(#halo)"/>
    <circle cx="413.3" cy="412.1" r="10" fill="#f2fff9"/>
  </g>
</svg>
